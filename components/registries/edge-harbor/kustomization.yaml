# Registry edge-harbor: labels every catalog object with the registry it was mirrored
# to. Included by mirrors/edge-harbor/kustomization.yaml, so OperatorHub/cluster (from
# base/) doesn't get this label.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
labels:
  - pairs:
      catalogs.example.com/registry: edge-harbor
    includeSelectors: false
